apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: thanos
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        revision: main
        files:
          - path: apps/thanos/application.yaml

  template:
    metadata:
      name: thanos
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        targetRevision: main
        path: apps/thanos
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
