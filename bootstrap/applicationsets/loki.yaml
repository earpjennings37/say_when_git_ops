apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: loki
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        revision: main
        files:
          - path: apps/loki/application.yaml

  template:
    metadata:
      name: loki
      namespace: argocd

    spec:
      project: default

      source:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        path: apps/loki

      destination:
        server: https://kubernetes.default.svc
        namespace: loki

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
