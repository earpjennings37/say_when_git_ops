apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: loki
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        revision: main
        directories:
          - path: apps/loki

  template:
    metadata:
      name: loki
      namespace: argocd

    spec:
      project: default

      source:
        repoURL: https://github.com/grafana/helm-charts.git
        chart: loki
        targetRevision: 6.6.2
        helm:
          valuesFiles:
            - values.yaml
            - loki.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: loki

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
