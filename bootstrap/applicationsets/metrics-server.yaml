apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: metrics-server
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        revision: main
        directories:
          - path: apps/metrics-server

  template:
    metadata:
      name: metrics-server
      namespace: argocd

    spec:
      project: default

      source:
        repoURL: https://github.com/kubernetes-sigs/metrics-server.git
        chart: metrics-server
        targetRevision: 3.12.0
        helm:
          valuesFiles:
            - values.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: kube-system

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
