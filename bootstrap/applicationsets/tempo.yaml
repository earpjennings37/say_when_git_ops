apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tempo
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        revision: main
        directories:
          - path: apps/tempo

  template:
    metadata:
      name: tempo
      namespace: argocd

    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: tempo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
