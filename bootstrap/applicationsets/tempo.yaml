apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tempo
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        revision: main
        directories:
          - path: apps/tempo

  template:
    metadata:
      name: tempo
      namespace: argocd

    spec:
      project: default

      source:
        repoURL: https://github.com/grafana/helm-charts.git
        chart: tempo
        targetRevision: 1.7.0
        helm:
          valuesFiles:
            - values.yaml
            - tempo.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: tempo

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
