apiVersion: argocd.io/v1alpha1
kind: ApplicationSet
metadata:
  name: thanos
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        revision: main
        directories:
          - path: apps/thanos-store
          - path: apps/thanos-query
          - path: apps/thanos-compactor

  template:
    metadata:
      name: '{{path.basename}}'
      namespace: argocd

    spec:
      project: default

      source:
        repoURL: https://github.com/bitnami/charts.git
        chart: thanos
        targetRevision: 12.3.0
        helm:
          valuesFiles:
            - values.yaml
            - '{{path.basename}}.yaml'

      destination:
        server: https://kubernetes.default.svc
        namespace: thanos

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
