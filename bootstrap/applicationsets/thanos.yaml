apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: thanos
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        revision: main
        files:
          - path: apps/thanos-store/application.yaml
          - path: apps/thanos-query/application.yaml
          - path: apps/thanos-compactor/application.yaml

  template:
    metadata:
      name: '{{metadata.name}}'
      namespace: argocd

    spec:
      project: default

      source:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        path: apps/{{metadata.name}}

      destination:
        server: https://kubernetes.default.svc
        namespace: thanos

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
