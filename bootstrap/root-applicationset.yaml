apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: root
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        revision: main
        files:
          - path: apps/*/application.yaml

  template:
    metadata:
      name: '{{metadata.name}}'
      namespace: argocd

    spec:
      project: default

      source:
        repoURL: '{{source.repoURL}}'
        chart: '{{source.chart}}'
        targetRevision: '{{source.targetRevision}}'
        helm:
          valuesFiles:
            - values.yaml
            - objstore.yaml

      destination:
        server: '{{destination.server}}'
        namespace: '{{destination.namespace}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true