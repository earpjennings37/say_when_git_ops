apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: root
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        revision: main
        files:
          - path: apps/*/application.yaml
  template:
    metadata:
      name: '{{path.basename}}'
      namespace: argocd
    spec:
      project: default
      source:
        # Use the repoURL and targetRevision from the application.yaml file
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        targetRevision: main
        path: '{{path}}'
      destination:
        # Do NOT override namespace — let application.yaml decide
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true