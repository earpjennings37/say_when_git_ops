apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: root
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        revision: main
        directories:
          - path: apps/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
      ignoreDifferences:
        - group: monitoring.coreos.com
          kind: ServiceMonitor
          jsonPointers:
            - /spec/endpoints
        - group: monitoring.coreos.com
          kind: PodMonitor
          jsonPointers:
            - /spec/podMetricsEndpoints
        - group: monitoring.coreos.com
          kind: PrometheusRule
          jsonPointers:
            - /spec
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/template/metadata/annotations
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/template/metadata/annotations
