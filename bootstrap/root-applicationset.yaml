apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: root
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        revision: main
        files:
          - path: apps/*/application.yaml

  template:
    metadata:
      name: '{{metadata.name}}'
      namespace: argocd

    spec:
      project: default

      # Copy the entire source block from the child YAML
      source: '{{source}}'

      # Copy the entire destination block from the child YAML
      destination: '{{destination}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true