apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: root
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        revision: main
        files:
          - path: apps/*/application.yaml

  template:
    metadata:
      name: '{{metadata.name}}'
      namespace: argocd

    spec:
      project: default

      source:
        repoURL: https://github.com/earpjennings37/say_when_git_ops.git
        targetRevision: main
        path: '{{path}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{spec.destination.namespace}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true