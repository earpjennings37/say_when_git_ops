apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default

  source:
    repoURL: https://github.com/earpjennings37/say_when_git_ops.git
    targetRevision: main
    path: apps/secret-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: secret-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true