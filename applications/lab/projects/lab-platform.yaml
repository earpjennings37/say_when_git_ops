apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab-platform
  namespace: argocd
  labels:
    environment: lab
    category: platform
spec:
  description: Core Kubernetes platform services for the lab cluster

  sourceRepos:
    - https://github.com/earpjennings37/say_when_git_ops.git
    - https://kubernetes-sigs.github.io/metrics-server/
    - public.ecr.aws/karpenter

  destinations:
    - namespace: kube-system
      server: https://kubernetes.default.svc

    - namespace: karpenter
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    # Metrics Server API registration.
    - group: apiregistration.k8s.io
      kind: APIService

    # Karpenter CRDs.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

    # Karpenter and Metrics Server cluster RBAC.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole

    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

    # Required by CreateNamespace=true.
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: ""
      kind: Service

    - group: ""
      kind: ServiceAccount

    - group: apps
      kind: Deployment

    - group: rbac.authorization.k8s.io
      kind: Role

    - group: rbac.authorization.k8s.io
      kind: RoleBinding

    - group: policy
      kind: PodDisruptionBudget