apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab-platform
  namespace: argocd
  labels:
    environment: lab
    category: platform
spec:
  description: Core Kubernetes platform services for the lab cluster

  sourceRepos:
    - https://github.com/earpjennings37/say_when_git_ops.git
    - https://kubernetes-sigs.github.io/metrics-server/
    - public.ecr.aws/karpenter

  destinations:
    - namespace: kube-system
      server: https://kubernetes.default.svc

    - namespace: karpenter
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: apiregistration.k8s.io
      kind: APIService

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

    - group: rbac.authorization.k8s.io
      kind: ClusterRole

    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

    - group: ""
      kind: Namespace

    # Argo CD manages the Karpenter EC2 configuration.
    - group: karpenter.k8s.aws
      kind: EC2NodeClass

    # Argo CD manages the Karpenter capacity and scheduling policy.
    - group: karpenter.sh
      kind: NodePool

  namespaceResourceWhitelist:
    - group: ""
      kind: Service

    - group: ""
      kind: ServiceAccount

    - group: apps
      kind: Deployment

    - group: rbac.authorization.k8s.io
      kind: Role

    - group: rbac.authorization.k8s.io
      kind: RoleBinding

    - group: policy
      kind: PodDisruptionBudget