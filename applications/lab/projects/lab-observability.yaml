apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab-observability
  namespace: argocd
  labels:
    environment: lab
    category: observability
spec:
  description: Monitoring, logging, tracing, and long-term metrics for the lab cluster

  # Approved Git, Helm, and OCI repositories.
  sourceRepos:
    - https://github.com/earpjennings37/say_when_git_ops.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - registry-1.docker.io/bitnamicharts

  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring

    # kube-prometheus-stack creates its kubelet monitoring
    # Service in kube-system.
    - server: https://kubernetes.default.svc
      namespace: kube-system

  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap

    - group: ""
      kind: Secret

    - group: ""
      kind: Service

    - group: ""
      kind: ServiceAccount

    - group: apps
      kind: DaemonSet

    - group: apps
      kind: Deployment

    - group: apps
      kind: StatefulSet

    - group: monitoring.coreos.com
      kind: Prometheus

    - group: monitoring.coreos.com
      kind: PrometheusRule

    - group: monitoring.coreos.com
      kind: ServiceMonitor

    - group: networking.k8s.io
      kind: NetworkPolicy

    - group: policy
      kind: PodDisruptionBudget

  clusterResourceWhitelist:
    # Allows CreateNamespace=true during a fresh cluster deployment.
    - group: ""
      kind: Namespace

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

    - group: rbac.authorization.k8s.io
      kind: ClusterRole

    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding