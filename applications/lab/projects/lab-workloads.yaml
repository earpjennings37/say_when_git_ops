apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab-workloads
  namespace: argocd
  labels:
    environment: lab
    category: workloads
spec:
  description: Demonstration application workloads for the lab cluster

  sourceRepos:
    - https://github.com/earpjennings37/say_when_git_ops.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: secret-demo

  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment

    - group: external-secrets.io
      kind: ExternalSecret

    - group: external-secrets.io
      kind: SecretStore

  clusterResourceWhitelist:
    # Required if the Applications use CreateNamespace=true
    # during a new cluster deployment.
    - group: ""
      kind: Namespace