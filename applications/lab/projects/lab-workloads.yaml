apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab-workloads
  namespace: argocd
  labels:
    environment: lab
    category: workloads
spec:
  sourceRepos:
    - https://github.com/earpjennings37/say_when_git_ops.git

  destinations:
    - namespace: secret-demo
      server: https://kubernetes.default.svc

    - namespace: gateway-demo
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment

    - group: ""
      kind: Service

    - group: external-secrets.io
      kind: ExternalSecret

    - group: external-secrets.io
      kind: SecretStore

    - group: gateway.networking.k8s.io
      kind: HTTPRoute