apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab-security
  namespace: argocd
  labels:
    environment: lab
    category: security
spec:
  description: Security tooling and policy workloads for the lab cluster

  # Approved Git and Helm repositories.
  sourceRepos:
    - https://github.com/earpjennings37/say_when_git_ops.git
    - https://charts.external-secrets.io
    - https://falcosecurity.github.io/charts
    - https://kyverno.github.io/kyverno/
    - https://aquasecurity.github.io/helm-charts/

  # Approved deployment destinations.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: external-secrets

    - server: https://kubernetes.default.svc
      namespace: falco

    - server: https://kubernetes.default.svc
      namespace: kube-bench

    - server: https://kubernetes.default.svc
      namespace: kyverno

    - server: https://kubernetes.default.svc
      namespace: monitoring

    - server: https://kubernetes.default.svc
      namespace: popeye

    - server: https://kubernetes.default.svc
      namespace: trivy-system

  # Namespaced resources rendered by the approved applications.
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap

    - group: ""
      kind: Secret

    - group: ""
      kind: Service

    - group: ""
      kind: ServiceAccount

    - group: apps
      kind: DaemonSet

    - group: apps
      kind: Deployment

    - group: apps
      kind: StatefulSet

    - group: batch
      kind: CronJob

    - group: networking.k8s.io
      kind: NetworkPolicy

    - group: rbac.authorization.k8s.io
      kind: Role

    - group: rbac.authorization.k8s.io
      kind: RoleBinding

  # Cluster-scoped resources rendered by the approved applications.
  clusterResourceWhitelist:
    # Required when CreateNamespace=true is used during cluster rebuilds.
    - group: ""
      kind: Namespace

    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

    - group: aquasecurity.github.io
      kind: ClusterComplianceReport

    - group: policies.kyverno.io
      kind: ValidatingPolicy

    - group: rbac.authorization.k8s.io
      kind: ClusterRole

    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
