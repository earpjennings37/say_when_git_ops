---
# Sources:
# https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/
# https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/#create-namespace

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollouts-demo
  namespace: argocd
  labels:
    environment: lab
    category: workloads

spec:
  project: lab-workloads

  source:
    repoURL: https://github.com/earpjennings37/say_when_git_ops.git
    targetRevision: main
    path: apps/rollouts-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: rollouts-demo

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/name: rollouts-demo
        app.kubernetes.io/part-of: argo-rollouts-lab
        app.kubernetes.io/managed-by: argocd

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
