---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thanos
  namespace: argocd
spec:
  project: lab-observability

  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: thanos
      targetRevision: 17.3.1
      helm:
        valueFiles:
          - $values/apps/thanos/values.yaml

    - repoURL: https://github.com/earpjennings37/say_when_git_ops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true