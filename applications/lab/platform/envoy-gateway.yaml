---
# Sources:
# https://gateway.envoyproxy.io/docs/install/install-argocd/
# https://argo-cd.readthedocs.io/en/stable/user-guide/multiple_sources/

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"

spec:
  project: lab-platform

  sources:
    # Install only the standard Gateway API CRDs and the
    # Envoy Gateway extension CRDs.
    - repoURL: docker.io/envoyproxy
      chart: gateway-crds-helm
      targetRevision: v1.6.7

      helm:
        releaseName: envoy-gateway-crds

        valuesObject:
          crds:
            gatewayAPI:
              enabled: true
              channel: standard

            envoyGateway:
              enabled: true

    # Install the Envoy Gateway controller without the CRDs
    # bundled inside the main chart.
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.6.7

      helm:
        releaseName: envoy-gateway
        skipCrds: true

        valueFiles:
          - $values/apps/envoy-gateway/values.yaml

    # Git repository containing our Helm values.
    - repoURL: https://github.com/earpjennings37/say_when_git_ops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
