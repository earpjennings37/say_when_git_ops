---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    # Install the controller before Rollout workloads.
    argocd.argoproj.io/sync-wave: "-1"

spec:
  project: lab-platform

  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-rollouts
      targetRevision: 2.43.11
      helm:
        releaseName: argo-rollouts
        valueFiles:
          - $values/apps/argo-rollouts/values.yaml

    - repoURL: https://github.com/earpjennings37/say_when_git_ops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
