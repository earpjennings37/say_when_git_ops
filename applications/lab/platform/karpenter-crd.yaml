---
# Sources:
# https://karpenter.sh/docs/upgrading/upgrade-guide/
# https://karpenter.sh/v1.0/upgrading/v1-migration/
# https://github.com/aws/karpenter-provider-aws/tree/v1.14.1/charts/karpenter-crd

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-crd
  namespace: argocd
  annotations:
    # Install the Karpenter CRDs before the controller.
    argocd.argoproj.io/sync-wave: "-2"

spec:
  project: lab-platform

  source:
    # Karpenter publishes its Helm charts as OCI artifacts in Public ECR.
    repoURL: public.ecr.aws/karpenter
    chart: karpenter-crd
    targetRevision: 1.14.1

  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true