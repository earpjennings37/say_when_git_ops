apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 87.21.0
      helm:
        valueFiles:
          - $values/apps/kube-prometheus-stack/values.yaml

    - repoURL: https://github.com/earpjennings37/say_when_git_ops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: kube-prometheus-stack-grafana
      namespace: monitoring
      jqPathExpressions:
        - '.spec.template.spec.containers[] | select(.name == "grafana-sc-dashboard") | .resources'
        - '.spec.template.spec.containers[] | select(.name == "grafana-sc-datasources") | .resources'

    - group: apps
      kind: DaemonSet
      name: kube-prometheus-stack-prometheus-node-exporter
      namespace: monitoring
      jqPathExpressions:
        - '.spec.template.spec.containers[] | select(.name == "node-exporter") | .resources'

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
      - Replace=true
      - RespectIgnoreDifferences=true

