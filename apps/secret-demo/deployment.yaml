apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-consumer
  namespace: secret-demo
  labels:
    app.kubernetes.io/name: secret-consumer
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: secret-consumer

  template:
    metadata:
      labels:
        app.kubernetes.io/name: secret-consumer

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: secret-consumer
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -ec

          args:
            - |
              if [ -z "${DEMO_USERNAME}" ] || [ -z "${DEMO_PASSWORD}" ]; then
                echo "Required credentials are missing."
                exit 1
              fi

              echo "Credentials loaded successfully; values will not be printed."

              while true; do
                sleep 3600
              done

          env:
            - name: DEMO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: demo-app-credentials
                  key: username

            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-app-credentials
                  key: password

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 25m
              memory: 32Mi

          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
