---
# The whoami application returns information about the HTTP
# request it receives. This makes it useful for validating that
# traffic passed through Envoy Gateway.
#
# Sources:
# https://github.com/traefik/whoami
# https://hub.docker.com/r/traefik/whoami

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-demo
  namespace: gateway-demo

  labels:
    app.kubernetes.io/name: gateway-demo
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: gateway-api-lab
    app.kubernetes.io/managed-by: argocd

spec:
  replicas: 1

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-demo

  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-demo
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: gateway-api-lab
        app.kubernetes.io/managed-by: argocd

    spec:
      # The application does not call the Kubernetes API.
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          imagePullPolicy: IfNotPresent

          args:
            - --port=8080

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL