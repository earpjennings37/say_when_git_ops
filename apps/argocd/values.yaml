configs:
  params:
    server.insecure: true
  cm:
    applicationSet:
      enableNewGenerators: "true"
  secret:
    server.secretkey: "<hex-key>"

server:
  enabled: true
  insecure: true
  service:
    type: ClusterIP
    ports:
      http: 80
  resources:
    requests:
      cpu: 20m
      memory: 50Mi
    limits:
      cpu: 100m
      memory: 100Mi

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 300m
      memory: 1Gi

installCRDs: true

applicationSet:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 30Mi
    limits:
      cpu: 50m
      memory: 50Mi

dex:
  enabled: false

redis:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 30Mi
    limits:
      cpu: 50m
      memory: 50Mi

additionalProjects: []