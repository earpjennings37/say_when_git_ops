spec:
  validationActions:
    - Deny

  evaluation:
    background:
      enabled: true

  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - falco

    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])

  validations:
    - expression: >-
        variables.allContainers.all(
          container,
          container.?securityContext.?allowPrivilegeEscalation.orValue(true) == false
        )
      message: >-
        Containers must set securityContext.allowPrivilegeEscalation to false.