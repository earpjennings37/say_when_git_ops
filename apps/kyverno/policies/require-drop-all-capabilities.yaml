apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy

metadata:
  name: require-drop-all-capabilities
  annotations:
    policies.kyverno.io/title: Require Dropping Linux Capabilities
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod

spec:
  validationActions:
    - Audit

  evaluation:
    background:
      enabled: true

  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system

    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])

  validations:
    - expression: >-
        variables.allContainers.all(
          container,
          container.?securityContext.?capabilities.?drop.orValue([]).exists(
            capability,
            capability == "ALL"
          )
        )
      message: >-
        Containers should drop all Linux capabilities using
        securityContext.capabilities.drop with ALL.