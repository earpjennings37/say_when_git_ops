apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy

metadata:
  name: disallow-latest-tag

  annotations:
    policies.kyverno.io/title: Disallow Latest Image Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod

spec:
  validationActions:
    - Audit

  evaluation:
    background:
      enabled: true

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])

  validations:
    - expression: >-
        variables.allContainers.all(
          container,
          !container.image.endsWith(":latest")
        )
      message: >-
        Containers should use a versioned image tag or immutable digest instead
        of the latest tag.