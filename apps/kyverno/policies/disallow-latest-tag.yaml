apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy

metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Require Explicit Image Version
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod

spec:
  validationActions:
    - Deny

  evaluation:
    background:
      enabled: true

  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system

    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])

  validations:
    - expression: >-
        variables.allContainers.all(
          container,
          container.image.contains("@") ||
          (
            container.image.matches("^.+:[^/:]+$") &&
            !container.image.endsWith(":latest")
          )
        )
      message: >-
        Container images must use an explicit version tag or immutable digest.
        The latest tag and images without a tag are not permitted.