apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-app-credentials
  namespace: secret-demo
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: demo-app-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: secret-demo

  data:
    - secretKey: username
      remoteRef:
        key: say-when/demo-app/credentials
        property: username

    - secretKey: password
      remoteRef:
        key: say-when/demo-app/credentials
        property: password
