---
# Sources:
# https://argo-rollouts.readthedocs.io/en/stable/features/bluegreen/
# https://argo-rollouts.readthedocs.io/en/stable/features/specification/

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollouts-bluegreen
  namespace: rollouts-bluegreen
  annotations:
    # Create the Services before the Rollout.
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: rollouts-bluegreen
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: argo-rollouts-lab
    app.kubernetes.io/managed-by: argocd

spec:
  replicas: 3
  revisionHistoryLimit: 3

  # Automatically abort an unhealthy preview version.
  progressDeadlineSeconds: 120
  progressDeadlineAbort: true

  selector:
    matchLabels:
      app.kubernetes.io/name: rollouts-bluegreen

  template:
    metadata:
      labels:
        app.kubernetes.io/name: rollouts-bluegreen
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: argo-rollouts-lab
        app.kubernetes.io/managed-by: argocd

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: rollouts-bluegreen
          image: argoproj/rollouts-demo:green
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

  strategy:
    blueGreen:
      # Production traffic uses this Service.
      activeService: rollouts-bluegreen-active

      # New versions are available through this Service before promotion.
      previewService: rollouts-bluegreen-preview

      # Keep only one preview pod running to reduce lab costs.
      previewReplicaCount: 1

      # Require manual approval before switching production traffic.
      autoPromotionEnabled: false

      # Keep the previous version alive briefly after promotion.
      scaleDownDelaySeconds: 30
