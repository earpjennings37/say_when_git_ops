---
# The preview Service exposes the new version before promotion.
# Argo Rollouts modifies its selector to target the preview ReplicaSet.

apiVersion: v1
kind: Service
metadata:
  name: rollouts-bluegreen-preview
  namespace: rollouts-bluegreen
  labels:
    app.kubernetes.io/name: rollouts-bluegreen
    app.kubernetes.io/component: preview-service
    app.kubernetes.io/part-of: argo-rollouts-lab
    app.kubernetes.io/managed-by: argocd

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: rollouts-bluegreen

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      