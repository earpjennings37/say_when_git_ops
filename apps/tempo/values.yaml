tempo:
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces

service:
  type: ClusterIP

persistence:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 20m
    memory: 100Mi
  limits:
    cpu: 100m
    memory: 200Mi