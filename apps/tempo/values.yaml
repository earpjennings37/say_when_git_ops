# ============================
# TEMPO (CHEAP MODE)
# ============================
tempo:
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces

  resources:
    requests:
      cpu: 20m
      memory: 100Mi
    limits:
      cpu: 100m
      memory: 200Mi

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  extraVolumeMounts:
    - name: tempo-data
      mountPath: /var/tempo


# Writable ephemeral storage for Tempo.
extraVolumes:
  - name: tempo-data
    emptyDir: {}


# Pod security context.
# fsGroup gives GID 10001 write access to mounted volumes.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch


service:
  type: ClusterIP


# Traces remain ephemeral.
persistence:
  enabled: false