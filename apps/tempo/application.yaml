apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/grafana/helm-charts.git
    chart: tempo
    targetRevision: 1.7.0
    helm:
      valuesFiles:
        - values.yaml
        - tempo.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: tempo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
