apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thanos-compactor
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: thanos
    targetRevision: 12.0.0
    helm:
      valuesFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: thanos-compactor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
