# ============================
# CRDs
# ============================
crds:
  enabled: true


# ============================
# GRAFANA (CHEAP MODE)
# ============================

# Access Grafana:
# kubectl port-forward \
#   svc/kube-prometheus-stack-grafana \
#   -n monitoring 3000:80
#
# Then open:
# http://localhost:3000

grafana:
  enabled: true
  adminPassword: "admin"

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring
      editable: false

    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring:3100
      editable: false

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi


# ============================
# PROMETHEUS (CHEAP MODE)
# ============================
prometheus:
  enabled: true

  service:
    type: ClusterIP

  # Service account used by Prometheus and the Thanos sidecar.
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::026090519635:role/thanos-irsa-role

  prometheusSpec:
    # Keep only 24 hours of metrics locally.
    retention: 24h
    retentionSize: 1GB

    replicas: 1
    walCompression: true

    # Thanos sidecar configuration.
    thanos:
      objectStorageConfig:
        existingSecret:
          name: thanos-objstore
          key: objstore.yml

    # Prometheus persistent storage.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi


# ============================
# ALERTMANAGER (DISABLED)
# ============================
alertmanager:
  enabled: false


# ============================
# NODE EXPORTER (CHEAP MODE)
# ============================
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 20Mi
    limits:
      cpu: 50m
      memory: 50Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL


# ============================
# KUBE STATE METRICS
# ============================
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
    limits:
      cpu: 50m
      memory: 100Mi


# ============================
# PROMETHEUS OPERATOR
# ============================
prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 50Mi
    limits:
      cpu: 100m
      memory: 100Mi

  admissionWebhooks:
    enabled: false
    patch:
      enabled: false

  tls:
    enabled: false