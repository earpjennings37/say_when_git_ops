loki:
  auth_enabled: false

  # Run Loki in single-binary mode (one pod only)
  singleBinary:
    replicas: 1

  # Disable microservices mode
  ingester:
    enabled: false

  querier:
    enabled: false

  queryFrontend:
    enabled: false

  gateway:
    enabled: false

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 20m
      memory: 100Mi
    limits:
      cpu: 100m
      memory: 200Mi

  storage:
    type: filesystem