# ============================================================
# Karpenter Controller
# ============================================================

# One replica is sufficient for this temporary home lab.
# Production environments should normally retain the chart's
# highly available default of two replicas.
replicas: 1

serviceAccount:
  create: true

  # Must match the Terraform EKS Pod Identity association.
  name: karpenter

  # No IRSA annotation is required because this deployment
  # uses EKS Pod Identity.
  annotations: {}

settings:
  # EKS cluster managed by this Karpenter controller.
  clusterName: say-when-east

  # Allow Karpenter to discover EKS control-plane details,
  # including the API endpoint, through DescribeCluster.
  # This prevents an ephemeral endpoint from being stored in Git.
  eksControlPlane: true

  # Terraform-created SQS queue receiving Spot interruption,
  # rebalance and EC2 lifecycle events.
  interruptionQueue: Karpenter-say-when-east

  isolatedVPC: false
  logLevel: info

# The chart's default affinity prevents the Karpenter controller
# from scheduling on nodes that Karpenter itself manages.
nodeSelector:
  kubernetes.io/os: linux

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Enable later after confirming Prometheus discovers resources
# in the karpenter namespace.
serviceMonitor:
  enabled: false

podDisruptionBudget:
  name: karpenter
  maxUnavailable: 1

podSecurityContext:
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault