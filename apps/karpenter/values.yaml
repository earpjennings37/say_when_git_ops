# ============================================================
# Karpenter Controller
#
# AWS IAM permissions are supplied through the EKS Pod Identity
# association created in the Terraform infrastructure repository.
#
# Do not add an IAM role annotation to this ServiceAccount.
# ============================================================

# Sources:
# https://github.com/aws/karpenter-provider-aws/blob/v1.14.1/charts/karpenter/values.yaml
# https://karpenter.sh/docs/getting-started/getting-started-with-karpenter/
# https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html

# One controller replica is sufficient for this small home lab.
replicas: 1

serviceAccount:
  create: true
  name: karpenter

  # EKS Pod Identity does not require the IRSA role annotation.
  annotations: {}

settings:
  # Must match the Terraform-managed EKS cluster name.
  clusterName: say-when-east

  # Terraform creates this SQS queue through the Karpenter module.
  # Karpenter uses it for Spot and EC2 interruption events.
  interruptionQueue: Karpenter-say-when-east

  # The cluster has internet access through its public subnets.
  isolatedVPC: false

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Leave disabled initially. It can be enabled later after confirming
# that the Prometheus Operator discovers monitors in this namespace.
serviceMonitor:
  enabled: false