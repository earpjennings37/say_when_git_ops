service:
  type: ClusterIP

replicaCount: 1

# Only query Prometheus directly (no sidecar, no store)
stores:
  - dnssrv+_http._tcp.prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local

# Disable PDB for single-node cluster
podDisruptionBudget:
  enabled: false

# Minimal probes
readinessProbe:
  httpGet:
    path: /-/ready
    port: 10902
  initialDelaySeconds: 5

livenessProbe:
  httpGet:
    path: /-/healthy
    port: 10902
  initialDelaySeconds: 5

# Remove topology spread constraints (single node)
topologySpreadConstraints: []

# ARM node selector is good
nodeSelector:
  kubernetes.io/arch: arm64

resources:
  requests:
    cpu: 20m
    memory: 50Mi
  limits:
    cpu: 50m
    memory: 100Mi

autoscaling:
  enabled: false