---
# Purpose:
# Deny all ingress and egress for every pod in say-when. Anything the
# app needs is opened explicitly in networkpolicy-allow.yaml.
#
# Sources:
# https://kubernetes.io/docs/concepts/services-networking/network-policies/#default-deny-all-ingress-and-all-egress-traffic
# https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: say-when
  labels:
    app.kubernetes.io/part-of: say-when

spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
