---
# Purpose:
# Tell External Secrets where the app's secrets live: AWS Secrets
# Manager in us-east-1. No credentials here: the ESO controller uses
# its own EKS Pod Identity role, which can read only the secrets
# granted in say_when_infra (app-secrets.tf).
#
# Sources:
# https://external-secrets.io/latest/provider/aws-secrets-manager/
# https://external-secrets.io/latest/api/secretstore/

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: say-when
  labels:
    app.kubernetes.io/part-of: say-when

spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
