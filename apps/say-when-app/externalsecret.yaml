---
# Purpose:
# Copy the admin token from Secrets Manager (say-when/app/settings,
# key admin_token) into a Kubernetes Secret the Deployment mounts as a
# file. Argo CD manages this ExternalSecret; ESO creates and owns the
# actual Secret, so the token value never appears in Git or in Argo.
#
# Sources:
# https://external-secrets.io/latest/api/externalsecret/
# https://kubernetes.io/docs/concepts/configuration/secret/

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: say-when-app-settings
  namespace: say-when
  labels:
    app.kubernetes.io/name: say-when-app
    app.kubernetes.io/part-of: say-when

spec:
  # Short for the lab, so a rotation shows up within about a minute.
  refreshInterval: 1m

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: say-when-app-settings
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: say-when-app

  data:
    - secretKey: admin_token
      remoteRef:
        key: say-when/app/settings
        property: admin_token
