---
# Purpose:
# Run the signed say-when-app image from ECR (built and signed by
# say_when_app CI). Chores come from a ConfigMap and the admin token
# from a Secret synced by External Secrets, both mounted as files that
# the app re-reads on every request (live updates, no restart).
#
# Sources:
# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
# https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
# https://kubernetes.io/docs/concepts/configuration/secret/#using-secrets-as-files-from-a-pod

apiVersion: apps/v1
kind: Deployment
metadata:
  name: say-when-app
  namespace: say-when
  labels:
    app.kubernetes.io/name: say-when-app
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: say-when

spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: say-when-app

  template:
    metadata:
      labels:
        app.kubernetes.io/name: say-when-app
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: say-when

    spec:
      serviceAccountName: say-when-app
      automountServiceAccountToken: false

      nodeSelector:
        kubernetes.io/arch: arm64

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: say-when-app

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001          # NEW: mounted Secret files owned by group 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app
          # NEW tag: Fall #3 build with /admin/status (say_when_app ce7d608).
          image: 026090519635.dkr.ecr.us-east-1.amazonaws.com/say-when-app:ce7d608c0ed0b24be0f9246f71cc08b53678d760
          imagePullPolicy: IfNotPresent

          env:
            - name: CHORES_FILE
              value: /etc/say-when/chores.yaml
            - name: ADMIN_TOKEN_FILE                      # NEW
              value: /etc/say-when/secrets/admin_token

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: chores
              mountPath: /etc/say-when
              readOnly: true
            - name: app-settings                          # NEW
              mountPath: /etc/say-when/secrets
              readOnly: true

      volumes:
        - name: chores
          configMap:
            name: say-when-chores
        - name: app-settings                              # NEW
          secret:
            secretName: say-when-app-settings
            defaultMode: 0440   # owner + group read only; group = fsGroup 10001
            items:
              - key: admin_token
                path: admin_token
