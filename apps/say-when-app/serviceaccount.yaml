---
# Purpose:
# Dedicated identity for the app. No Kubernetes API token is mounted:
# the app never talks to the API. Fall #5 attaches AWS access (S3/SQS)
# to this account through EKS Pod Identity.
#
# Source:
# https://kubernetes.io/docs/concepts/security/service-accounts/

apiVersion: v1
kind: ServiceAccount
metadata:
  name: say-when-app
  namespace: say-when
  labels:
    app.kubernetes.io/name: say-when-app
    app.kubernetes.io/part-of: say-when
automountServiceAccountToken: false
