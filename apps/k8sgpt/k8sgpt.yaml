apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT

metadata:
  name: k8sgpt-bedrock
  namespace: k8sgpt-operator-system

  labels:
    app.kubernetes.io/name: k8sgpt
    app.kubernetes.io/component: analyzer

spec:
  analysis:
    interval: 5m
  # Pin the analyzer image instead of using latest.
  repository: ghcr.io/k8sgpt-ai/k8sgpt
  version: v0.4.39
  imagePullPolicy: IfNotPresent

  deploymentLabels:
    app.kubernetes.io/name: k8sgpt
    app.kubernetes.io/component: analyzer

  podLabels:
    app.kubernetes.io/name: k8sgpt
    app.kubernetes.io/component: analyzer

  ai:
    enabled: true
    backend: amazonbedrock
    model: amazon.nova-lite-v1:0
    region: us-east-1
    anonymized: true
    language: english
    maxTokens: "2048"

    backOff:
      enabled: true
      maxRetries: 3

    autoRemediation:
      enabled: false
      resources:
        - Pod
        - Deployment
      similarityRequirement: "90"

  extraOptions:
    serviceAccountIRSA: arn:aws:iam::026090519635:role/k8sgpt-bedrock-irsa-role

    backstage:
      enabled: false

  filters:
    - Pod
    - Deployment
    - StatefulSet
    - DaemonSet
    - Service
    - Ingress
    - PersistentVolumeClaim
    - CronJob

  noCache: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532

  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi