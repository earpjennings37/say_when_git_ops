# -----------------------------
# S3 Object Storage (IRSA)
# -----------------------------
global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/thanos
  tag: 0.39.2-debian-12-r2
  
objstoreConfig:
  type: s3
  config:
    bucket: thanos-infinity-37
    endpoint: s3.amazonaws.com
    region: us-east-1
    insecure: false

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::026090519635:role/thanos-irsa-role

# -----------------------------
# Thanos Query
# -----------------------------
query:
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# -----------------------------
# Thanos Store Gateway
# -----------------------------
storegateway:
  enabled: true
  replicaCount: 1

  persistence:
    enabled: true
    size: 10Gi
    storageClass: gp3

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 150m
      memory: 256Mi

# -----------------------------
# Thanos Compactor
# -----------------------------
compactor:
  enabled: false

# -----------------------------
# Disable non-essential components
# -----------------------------
bucketweb:
  enabled: false

queryFrontend:
  enabled: false

ruler:
  enabled: false

receive:
  enabled: false