---
name: GitOps Validate

on:
  pull_request:
    paths:
      - "applications/**/*.yaml"
      - "applications/**/*.yml"
      - "apps/**/*.yaml"
      - "apps/**/*.yml"
      - "bootstrap/**/*.yaml"
      - "bootstrap/**/*.yml"
      - ".yamllint.yaml"
      - ".github/workflows/gitops-validate.yaml"

  push:
    branches:
      - main
    paths:
      - "applications/**/*.yaml"
      - "applications/**/*.yml"
      - "apps/**/*.yaml"
      - "apps/**/*.yml"
      - "bootstrap/**/*.yaml"
      - "bootstrap/**/*.yml"
      - ".yamllint.yaml"
      - ".github/workflows/gitops-validate.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install yamllint
        run: python3 -m pip install --disable-pip-version-check yamllint==1.37.1

      - name: Validate YAML files
        run: yamllint -c .yamllint.yaml applications apps bootstrap