# kubectl-ai local configuration example
#
# This file is tracked in Git for documentation.
# Copy it to ~/.config/kubectl-ai/config.yaml before using kubectl-ai.
#
# AWS credentials are intentionally not stored here.
# kubectl-ai uses the standard AWS SDK credential chain.
#
# Set the AWS Region separately:
# export AWS_REGION=us-east-1
# export AWS_DEFAULT_REGION=us-east-1

# Amazon Bedrock provider
llmProvider: bedrock

# Anthropic Claude US cross-region inference profile
model: us.anthropic.claude-sonnet-4-6

# Claude supports native Bedrock tool use.
enableToolUseShim: false

# Use the current user's Kubernetes configuration.
kubeconfig: ~/.kube/config

# Require approval for modifying or potentially unsafe commands.
skipPermissions: false

# Limit unexpected command loops and Bedrock usage.
# Increase temporarily for complex investigations if necessary.
maxIterations: 3

# Use interactive terminal output so commands can be reviewed.
quiet: false
uiType: terminal

# Remove temporary working files after each session.
removeWorkdir: true

# Write diagnostic traces here when troubleshooting.
tracePath: /tmp/kubectl-ai-trace.txt